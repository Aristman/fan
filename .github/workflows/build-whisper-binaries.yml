name: Build whisper.cpp binaries for voice-ollama-tui

on:
  workflow_dispatch:
    inputs:
      whisper_version:
        description: 'whisper.cpp version tag (e.g. v1.9.1)'
        required: true
        default: 'v1.9.1'
      extension_version:
        description: 'voice-ollama-tui extension version to bundle for'
        required: true
        default: '1.2.0'

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4
        with:
          path: fan-repo

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential gcc-aarch64-linux-gnu g++-aarch64-linux-gnu mingw-w64 zip

      - name: Build linux-x64
        run: cd fan-repo && ./scripts/build-whisper-binaries-linux.sh --platform linux-x64 --version ${{ github.event.inputs.whisper_version }}

      - name: Build linux-arm64
        run: cd fan-repo && ./scripts/build-whisper-binaries-linux.sh --platform linux-arm64 --version ${{ github.event.inputs.whisper_version }}

      - name: Build windows-x64
        run: cd fan-repo && ./scripts/build-whisper-binaries-linux.sh --platform windows-x64 --version ${{ github.event.inputs.whisper_version }}

      - name: Upload linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voice-ollama-tui-whisper-bin-linux
          path: /tmp/voice-ollama-tui-whisper-bin-*

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4
        with:
          path: fan-repo

      - name: Install dependencies
        run: |
          brew install cmake

      - name: Build darwin binaries
        run: cd fan-repo && ./scripts/build-whisper-binaries-macos.sh --version ${{ github.event.inputs.whisper_version }}

      - name: Upload darwin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voice-ollama-tui-whisper-bin-darwin
          path: /tmp/voice-ollama-tui-whisper-bin-*
