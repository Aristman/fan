name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: darwin-arm64
            os: macos-latest
          - platform: darwin-x64
            os: macos-latest
          - platform: linux-x64
            os: ubuntu-latest
          - platform: linux-arm64
            os: ubuntu-latest-arm
          - platform: windows-x64
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: cd packages/db && npx prisma generate

      - name: Build all packages
        run: npm run build

      - name: Build dashboard
        run: npm run build:dashboard

      - name: Build binary (${{ matrix.platform }})
        run: |
          bun build --compile \
            --external koffi \
            --target=bun-${{ matrix.platform }} \
            --outfile packages/coding-agent/binaries/${{ matrix.platform }}/fan${{ matrix.platform == 'windows-x64' && '.exe' || '' }} \
            packages/coding-agent/src/cli.ts

      - name: Copy assets
        run: |
          PLATFORM="${{ matrix.platform }}"
          OUTDIR="packages/coding-agent/binaries/$PLATFORM"
          
          # Orchestrator assets
          mkdir -p "$OUTDIR/orchestrator/agents" "$OUTDIR/orchestrator/prompts"
          cp packages/orchestrator/src/config.json "$OUTDIR/orchestrator/" 2>/dev/null || true
          cp packages/orchestrator/src/agents/*.md "$OUTDIR/orchestrator/agents/" 2>/dev/null || true
          cp packages/orchestrator/src/prompts/*.md "$OUTDIR/orchestrator/prompts/" 2>/dev/null || true
          
          # Dashboard
          mkdir -p "$OUTDIR/dashboard"
          cp -r packages/dashboard/dist/* "$OUTDIR/dashboard/"
          
          # Photon WASM
          cp packages/coding-agent/src/modes/interactive/assets/photon_rs_bg.wasm "$OUTDIR/" 2>/dev/null || true
          
          # Themes
          mkdir -p "$OUTDIR/theme"
          cp packages/coding-agent/src/modes/interactive/theme/*.json "$OUTDIR/theme/" 2>/dev/null || true
          
          # Windows: copy koffi native binding
          if [ "$PLATFORM" = "windows-x64" ]; then
            cp node_modules/@aspect-build/koffi/build/koffi/napi-v6/win32-x64/koffi.node "$OUTDIR/" 2>/dev/null || true
          fi
        shell: bash

      - name: Create archive
        run: |
          PLATFORM="${{ matrix.platform }}"
          OUTDIR="packages/coding-agent/binaries/$PLATFORM"
          
          cd "$OUTDIR"
          if [[ "$PLATFORM" == "windows-x64" ]]; then
            7z a "../../fan-$PLATFORM.zip" .
          else
            mkdir -p "../fan-$PLATFORM"
            cp -r . "../fan-$PLATFORM/"
            cd ..
            tar czf "fan-$PLATFORM.tar.gz" "fan-$PLATFORM"
            rm -rf "fan-$PLATFORM"
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fan-${{ matrix.platform }}
          path: packages/coding-agent/binaries/fan-${{ matrix.platform }}.*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
