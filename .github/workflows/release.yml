name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: darwin-arm64
            os: macos-latest
          - platform: darwin-x64
            os: macos-latest
          - platform: linux-x64
            os: ubuntu-latest
          - platform: linux-arm64
            os: ubuntu-latest-arm
          - platform: windows-x64
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install cross-platform native bindings
        run: |
          npm install --no-save --force \
            @mariozechner/clipboard-darwin-arm64@0.3.0 \
            @mariozechner/clipboard-darwin-x64@0.3.0 \
            @mariozechner/clipboard-linux-x64-gnu@0.3.0 \
            @mariozechner/clipboard-linux-arm64-gnu@0.3.0 \
            @mariozechner/clipboard-win32-x64-msvc@0.3.0 \
            @img/sharp-darwin-arm64@0.34.5 \
            @img/sharp-darwin-x64@0.34.5 \
            @img/sharp-linux-x64@0.34.5 \
            @img/sharp-linux-arm64@0.34.5 \
            @img/sharp-win32-x64@0.34.5 \
            @img/sharp-libvips-darwin-arm64@1.2.4 \
            @img/sharp-libvips-darwin-x64@1.2.4 \
            @img/sharp-libvips-linux-x64@1.2.4 \
            @img/sharp-libvips-linux-arm64@1.2.4

      - name: Generate Prisma client
        run: cd packages/db && npx prisma generate

      - name: Build all packages
        run: npm run build

      - name: Build dashboard
        run: npm run build:dashboard

      - name: Build binary (${{ matrix.platform }})
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "windows-x64" ]]; then
            bun build --compile --external koffi --target=bun-${{ matrix.platform }} packages/coding-agent/dist/bun/cli.js --outfile packages/coding-agent/binaries/${{ matrix.platform }}/fan.exe
          else
            bun build --compile --external koffi --target=bun-${{ matrix.platform }} packages/coding-agent/dist/bun/cli.js --outfile packages/coding-agent/binaries/${{ matrix.platform }}/fan
          fi

      - name: Copy assets
        run: |
          PLATFORM="${{ matrix.platform }}"
          OUTDIR="packages/coding-agent/binaries/$PLATFORM"
          
          # Package metadata
          cp packages/coding-agent/package.json "$OUTDIR/"
          cp packages/coding-agent/README.md "$OUTDIR/"
          cp packages/coding-agent/CHANGELOG.md "$OUTDIR/"
          
          # Photon WASM
          cp node_modules/@silvia-odwyer/photon-node/photon_rs_bg.wasm "$OUTDIR/"
          
          # Theme (from dist, not src)
          mkdir -p "$OUTDIR/theme"
          cp packages/coding-agent/dist/modes/interactive/theme/*.json "$OUTDIR/theme/"
          
          # Interactive assets (from dist)
          mkdir -p "$OUTDIR/assets"
          cp packages/coding-agent/dist/modes/interactive/assets/* "$OUTDIR/assets/"
          
          # Export HTML
          cp -r packages/coding-agent/dist/core/export-html "$OUTDIR/"
          
          # Documentation and examples
          cp -r docs "$OUTDIR/"
          cp -r examples "$OUTDIR/"
          
          # Orchestrator assets
          mkdir -p "$OUTDIR/orchestrator/agents" "$OUTDIR/orchestrator/prompts"
          cp packages/orchestrator/src/config.json "$OUTDIR/orchestrator/" 2>/dev/null || true
          cp packages/orchestrator/src/agents/*.md "$OUTDIR/orchestrator/agents/" 2>/dev/null || true
          cp packages/orchestrator/src/prompts/*.md "$OUTDIR/orchestrator/prompts/" 2>/dev/null || true
          
          # Dashboard
          mkdir -p "$OUTDIR/dashboard"
          cp -r packages/dashboard/dist/* "$OUTDIR/dashboard/"
          
          # Windows: copy koffi native module with proper directory structure
          if [[ "$PLATFORM" == "windows-x64" ]]; then
            mkdir -p "$OUTDIR/node_modules/koffi/build/koffi/win32_x64"
            cp node_modules/koffi/index.js "$OUTDIR/node_modules/koffi/"
            cp node_modules/koffi/package.json "$OUTDIR/node_modules/koffi/"
            cp node_modules/koffi/build/koffi/win32_x64/koffi.node "$OUTDIR/node_modules/koffi/build/koffi/win32_x64/"
          fi
        shell: bash

      - name: Create archive
        run: |
          PLATFORM="${{ matrix.platform }}"
          OUTDIR="packages/coding-agent/binaries/$PLATFORM"
          
          cd "$OUTDIR"
          if [[ "$PLATFORM" == "windows-x64" ]]; then
            7z a "../fan-$PLATFORM.zip" .
          else
            mkdir -p "../fan-$PLATFORM"
            cp -r . "../fan-$PLATFORM/"
            cd ..
            tar czf "fan-$PLATFORM.tar.gz" "fan-$PLATFORM"
            rm -rf "fan-$PLATFORM"
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fan-${{ matrix.platform }}
          path: packages/coding-agent/binaries/fan-${{ matrix.platform }}.*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
