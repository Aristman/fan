# DEPLOY.toml — FAN Package Deployment Manifest
# Schema version: 1

[package]
name = "fan-mission"
type = "extension"

include = [
    "*.ts",
    "templates/**/*.ts",
    "package.json",
]

exclude = [
    "node_modules/",
    "*.test.ts",
    "*.spec.ts",
    "vitest.config.*",
    ".env",
    ".env.*",
    "dist/",
    "*.lock",
    "package-lock.json",
    "bun.lock",
    ".git/",
    ".DS_Store",
    "test/**",
    "tsconfig.json",
    ".fan/",
]

preserve = []
