# =============================================================================
# agent.sea-agents.ru — FAN runtime (API gateway reverse proxy)
#
# Feature: F-0.7 (Phase 0 — Network Contour)
# VPS: 185.219.41.46 (hosts fan.sea-agents.ru — FAN Store — side by side)
#
# Deploy location (Ubuntu, nginx from apt):
#   /etc/nginx/sites-available/agent.sea-agents.ru.conf
#   ln -s ../sites-available/agent.sea-agents.ru.conf /etc/nginx/sites-enabled/
# Alternative (also valid — conf.d is included inside the http {} context,
# so the `map` directive below is legal there):
#   /etc/nginx/conf.d/agent.sea-agents.ru.conf
#
# The existing fan.sea-agents.ru (FAN Store) server block is NOT touched.
# No port conflicts: FAN runtime listens on 127.0.0.1:3456 (loopback only,
# published by docker-compose.yml), nginx owns 80/443.
#
# Auth note: token auth of the FAN API gateway (ClientToken in DB) is the
# single auth layer. HTTP Basic Auth at the nginx level was considered and
# REJECTED for v2 — if an extra perimeter is ever wanted, uncomment the
# auth_basic lines in the location block and create the htpasswd file:
#   htpasswd -cb /etc/nginx/.agent-htpasswd <user> <pass>
# =============================================================================

# WebSocket connection upgrade mapping.
# NOTE: this `map` must be defined exactly ONCE across all nginx configs on
# the host. If another config already defines `$connection_upgrade`, remove
# the block below and reuse the existing one.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name agent.sea-agents.ru;

    # Let's Encrypt HTTP-01 challenge (certbot --webroot / renewals)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — FAN API gateway
server {
    # `listen ... http2` form (not `http2 on;`) for compatibility with
    # nginx < 1.25 shipped by Ubuntu apt; newer nginx only warns.
    listen 443 ssl http2;
    server_name agent.sea-agents.ru;

    # Let's Encrypt certificates (certbot certonly --nginx -d agent.sea-agents.ru)
    ssl_certificate     /etc/letsencrypt/live/agent.sea-agents.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent.sea-agents.ru/privkey.pem;

    # Sensible TLS defaults (aligned with certbot's options-ssl-nginx.conf)
    ssl_session_timeout 1d;
    ssl_session_cache shared:FANSSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # Allow larger payloads (file contents, diffs) if ever proxied via HTTP
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3456;

        # WebSocket upgrade (uses the $connection_upgrade map above)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standard reverse-proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived WebSocket sessions: keep idle connections for 24h.
        # (Default 60s would kill idle WS clients.)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Do not buffer SSE/WS-style streamed responses
        proxy_buffering off;

        # Optional second auth layer — DISABLED by decision (v2): FAN token
        # auth is sufficient. Uncomment only together with an htpasswd file:
        # auth_basic "FAN Agent";
        # auth_basic_user_file /etc/nginx/.agent-htpasswd;
    }
}
