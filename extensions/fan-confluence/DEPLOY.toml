# DEPLOY.toml — FAN Package Deployment Manifest
# Schema version: 1

[package]
name = "fan-confluence"
type = "extension"

include = [
    "index.ts",
    "client.ts",
    "config.ts",
    "converters/*.ts",
    "tools/*.ts",
    "package.json",
    "README.md",
    ".env.example",
]

exclude = [
    "node_modules/",
    "*.test.ts",
    "*.spec.ts",
    "vitest.config.*",
    ".env",
    ".env.local",
    ".env.development",
    "dist/",
    "*.lock",
    "package-lock.json",
    "bun.lock",
    ".git/",
    ".DS_Store",
    "tests/**",
]

preserve = [
    ".env",
]
