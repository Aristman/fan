# DEPLOY.toml — FAN Package Deployment Manifest
# Schema version: 1

[package]
name = "fan-orchestrator"
type = "extension"

include = [
    "*.js",
    "*.d.ts",
    "agents/*.js",
    "agents/*.d.ts",
    "agents/*.md",
    "prompts/*.md",
    "package.json",
    "README.md",
    "config.example.json",
]

exclude = [
    "node_modules/",
    "*.test.ts",
    "*.spec.ts",
    "vitest.config.*",
    ".env",
    ".env.*",
    "dist/",
    "*.lock",
    "package-lock.json",
    "bun.lock",
    ".git/",
    ".DS_Store",
    "test/**",
    "config.json",
]

preserve = [
    "config.json",
]
